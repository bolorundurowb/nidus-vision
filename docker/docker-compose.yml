services:
  nidus-vision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nidus-vision
    restart: unless-stopped
    ports:
      - "6438:6438"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dri:/dev/dri
    # The server runs as the non-root `app` user. The entrypoint also grants it the
    # groups that own /dev/dri; keep these GIDs matching `ls -ln /dev/dri` on the host.
    group_add:
      - "44"
      - "109"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:6438
      TZ: UTC
      FFMPEG_PATH: /usr/bin/ffmpeg
      Storage__DataDirectory: /app/data
      Storage__RecordingsDirectory: /var/nidus/recordings
      Storage__EventsDirectory: /var/nidus/events
      # Optional override. The image already includes /app/models/person.onnx.
      # Set this only when the file exists; a missing path turns detection off.
      # NIDUS_PERSON_MODEL: /models/custom-person.onnx
      # Optional VAAPI video decode (separate from OpenVINO GPU inference):
      # LIBVA_DRIVER_NAME: iHD
    volumes:
      - nidus-data:/app/data
      - nidus-recordings:/var/nidus/recordings
      - nidus-events:/var/nidus/events
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:6438/health && curl -f http://localhost:6438/favicon.ico"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nidus-data:
  nidus-recordings:
  nidus-events:
