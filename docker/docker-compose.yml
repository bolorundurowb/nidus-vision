services:
  nidus-vision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nidus-vision
    restart: unless-stopped
    ports:
      - "6438:6438"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "109"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:6438
      TZ: UTC
      FFMPEG_PATH: /usr/bin/ffmpeg
      Storage__DataDirectory: /app/data
      Storage__RecordingsDirectory: /var/nidus/recordings
      Storage__EventsDirectory: /var/nidus/events
      # NIDUS_PERSON_MODEL: /app/models/person.onnx
      # Optional VAAPI video decode (separate from OpenVINO GPU inference):
      # LIBVA_DRIVER_NAME: iHD
    volumes:
      - nidus-data:/app/data
      - nidus-recordings:/var/nidus/recordings
      - nidus-events:/var/nidus/events
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6438/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nidus-data:
  nidus-recordings:
  nidus-events:
