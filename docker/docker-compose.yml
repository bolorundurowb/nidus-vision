services:
  nidus-vision:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nidus-vision
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: UTC
      FFMPEG_PATH: /usr/bin/ffmpeg
      Storage__DataDirectory: /app/data
      Storage__RecordingsDirectory: /var/nidus/recordings
      Storage__EventsDirectory: /var/nidus/events
      # LIBVA_DRIVER_NAME: iHD
      # OPENVINO_DEVICE: GPU
      # NIDUS_PERSON_MODEL: /app/models/person.onnx
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    #   - /dev/dri/card0:/dev/dri/card0
    # group_add:
    #   - "44"
    #   - "109"
    volumes:
      - nidus-data:/app/data
      - nidus-recordings:/var/nidus/recordings
      - nidus-events:/var/nidus/events
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nidus-data:
  nidus-recordings:
  nidus-events:
