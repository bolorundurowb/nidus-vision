name: Publish

on:
  push:
    tags:
      - "**"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/NidusVision.Client/package-lock.json

      - name: Stamp release version
        run: bash .github/scripts/stamp-version.sh "${GITHUB_REF_NAME}"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore and build
        run: |
          dotnet restore NidusVision.slnx
          dotnet build NidusVision.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test NidusVision.slnx --no-build --configuration Release

      - name: Angular production build
        working-directory: src/NidusVision.Client
        run: |
          npm ci
          npm run build

  sync-versions:
    name: Sync version files on main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history so a racing push can be resolved by rebasing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Commit the tagged version to main
        run: bash .github/scripts/sync-version.sh "${GITHUB_REF_NAME}"

  docker:
    name: Push to Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # The image build reads the version files from this checkout, so stamp
      # the tag's version into them first.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp release version
        run: bash .github/scripts/stamp-version.sh "${GITHUB_REF_NAME}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: bolorundurowb
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: bolorundurowb/nidus-vision
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          # The repo licence is MIT, but the image also ships the AGPL-3.0 person model.
          labels: |
            org.opencontainers.image.licenses=MIT AND AGPL-3.0

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and all tags so the notes can diff against the previous release.
          fetch-depth: 0

      - name: Create or update release notes
        id: release
        uses: actions/github-script@v7
        env:
          DOCKER_IMAGE: bolorundurowb/nidus-vision
        with:
          script: |
            const generate = require('./.github/scripts/release-notes.js');
            await generate({ github, context, core, exec });

      - name: Release URL
        run: echo "Published ${{ steps.release.outputs.release-url }}"
