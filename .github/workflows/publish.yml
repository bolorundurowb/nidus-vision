name: Publish

on:
  push:
    tags:
      - "**"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/NidusVision.Client/package-lock.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore and build
        run: |
          dotnet restore NidusVision.slnx
          dotnet build NidusVision.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test NidusVision.slnx --no-build --configuration Release

      - name: Angular production build
        working-directory: src/NidusVision.Client
        run: |
          npm ci
          npm run build

  docker:
    name: Push to Docker Hub
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: bolorundurowb
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: bolorundurowb/nidus-vision
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
